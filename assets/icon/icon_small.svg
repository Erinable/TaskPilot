<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- TaskPilot app icon for 16–64 px: two thick rows so it still reads as a checklist. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="0.55" stop-color="#3f6bf5"/>
      <stop offset="1" stop-color="#6a4be0"/>
    </linearGradient>
  </defs>
  <!-- Same squircle as icon.svg, so sizes never jump in the Dock. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(0.92) translate(-512 -512)">
  <rect x="196" y="232" width="632" height="560" rx="96" fill="#ffffff" fill-opacity="0.95"/>
  <circle cx="350" cy="400" r="74" fill="#3f6bf5"/>
  <path d="M312 400 L 340 430 L 392 370" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="460" y="368" width="300" height="64" rx="32" fill="#3f6bf5" fill-opacity="0.85"/>
  <circle cx="350" cy="624" r="62" fill="none" stroke="#3f6bf5" stroke-opacity="0.5" stroke-width="22"/>
  <rect x="460" y="592" width="240" height="64" rx="32" fill="#3f6bf5" fill-opacity="0.35"/>
  </g>
</svg>

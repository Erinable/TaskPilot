<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- TaskPilot app icon (128 px and up): a frosted task card, first item done.
       Smaller sizes use icon_small.svg. Rebuild with scripts/build_icon.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="0.55" stop-color="#3f6bf5"/>
      <stop offset="1" stop-color="#6a4be0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <!-- The next card in the queue, peeking out behind. -->
  <rect x="282" y="196" width="460" height="120" rx="48" fill="#ffffff" fill-opacity="0.35"/>
  <g filter="url(#drop)">
    <rect x="222" y="252" width="580" height="540" rx="78" fill="#ffffff" fill-opacity="0.94"/>
  </g>
  <circle cx="338" cy="398" r="46" fill="#3f6bf5"/>
  <path d="M315 398 L 332 416 L 363 380" fill="none" stroke="#ffffff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="414" y="380" width="304" height="36" rx="18" fill="#3f6bf5" fill-opacity="0.85"/>
  <circle cx="338" cy="530" r="40" fill="none" stroke="#3f6bf5" stroke-opacity="0.45" stroke-width="12"/>
  <rect x="414" y="512" width="248" height="36" rx="18" fill="#3f6bf5" fill-opacity="0.3"/>
  <circle cx="338" cy="660" r="40" fill="none" stroke="#3f6bf5" stroke-opacity="0.45" stroke-width="12"/>
  <rect x="414" y="642" width="278" height="36" rx="18" fill="#3f6bf5" fill-opacity="0.3"/>
</svg>

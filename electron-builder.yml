# Local macOS packaging: npm run dist -> dist/.
# Ad-hoc signed without Developer ID or notarization.
# Automatic updates remain disabled until a trusted update channel exists.
appId: com.taskpilot.app
productName: TaskPilot
artifactName: TaskPilot-${version}-${arch}.${ext}
directories:
  output: dist
  buildResources: assets
files:
  - out/**
  - package.json
extraResources:
  # The built-in course packs, read at startup from Resources/courses
  # (src/main/courses.ts loadBuiltinCourses).
  - from: resources/courses
    to: courses
    filter:
      - '*.toml'
  # The coding user setup script and the wrapper it installs, for the user to
  # review and run by hand; the setup script finds the wrapper beside itself.
  - from: scripts
    to: scripts
    filter:
      - setup-coding-agent-user.sh
      - taskpilot-coding-wrapper.sh
mac:
  icon: assets/icon/icon.icns
  category: public.app-category.developer-tools
  # A local signature keeps Apple Silicon bundles valid without an account.
  identity: '-'
  # The ad-hoc channel has no Developer ID runtime entitlements. Enable and
  # validate hardened runtime when adding a notarized Developer ID channel.
  hardenedRuntime: false
  target:
    - dmg
    - zip
publish: null

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Tools the end-to-end preset and lab tests drive. Under CI a missing one
      # fails its test file (tests/fixtures/required_tools.ts) instead of skipping.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.6
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential=12.10ubuntu1 make=4.3-4.1build2
      - if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      # Electron's postinstall downloads its binary; the build and tests do not need it.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  analyze:
    name: Code analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        id: install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run analyze:duplicates
        id: duplicates
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: duplicate-code-report
          path: .taskpilot/analysis/duplicates/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - run: npm run check:complexity -- --base "$COMPLEXITY_BASE"
        id: complexity
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          COMPLEXITY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: complexity-report
          path: .taskpilot/analysis/complexity/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Check circular dependencies
        id: cycles
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p .taskpilot/analysis/cycles
          npm run analyze:cycles 2>&1 | tee .taskpilot/analysis/cycles/knip.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cycle-dependency-report
          path: .taskpilot/analysis/cycles/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Write code analysis summary
        if: ${{ !cancelled() }}
        run: >-
          npm run summarize:analysis --
          --output "$GITHUB_STEP_SUMMARY"
          --duplicates "${{ steps.duplicates.outcome }}"
          --complexity "${{ steps.complexity.outcome }}"
          --cycles "${{ steps.cycles.outcome }}"
